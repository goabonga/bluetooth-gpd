# bluetooth: plays through bluetooth-daemon, which sends the audio to the
# headset or speaker in use. The bluetooth PCM is the plugin
# libasound_module_pcm_bluetooth.so; it only has the sample rate negotiated
# with the device, so plug converts whatever an application asks for.
pcm.bluetooth { type bluetooth }
pcm.bluetooth_out {
    type plug
    slave { pcm "bluetooth" format S16_LE channels 2 }
}
