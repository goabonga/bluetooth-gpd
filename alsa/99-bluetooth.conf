# bluetooth: plays through bluetooth-daemon, which sends the audio to the
# headset or speaker in use. The bluetooth PCM is the plugin
# libasound_module_pcm_bluetooth.so; it only has the sample rate negotiated
# with the device, so plug converts whatever an application asks for.
pcm.bluetooth { type bluetooth }
pcm.bluetooth_out {
    type plug
    slave { pcm "bluetooth" format S16_LE channels 2 }
}
# The microphone of the headset: mono, at the rate of the voice link (8 or
# 16 kHz). Opening it starts the hands-free and voice links.
pcm.bluetooth_in {
    type plug
    slave { pcm "bluetooth" format S16_LE channels 1 }
}
# With several audio devices connected, bluetooth_out and bluetooth_in use the
# one connected last. To pick a device, define a PCM with its address:
#
# pcm.speaker {
#     type plug
#     slave { pcm { type bluetooth device "AA:BB:CC:DD:EE:FF" } format S16_LE channels 2 }
# }
